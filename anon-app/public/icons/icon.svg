<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a0208"/>
      <stop offset="100%" stop-color="#040203"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff2d55"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <rect x="6" y="6" width="500" height="500" rx="90" fill="none" stroke="url(#accent)" stroke-opacity="0.35" stroke-width="2"/>

  <g filter="url(#glow)">
    <path d="M128 340 L192 172 L256 340 M160 288 L224 288"
          stroke="url(#accent)" stroke-width="18" fill="none"
          stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M300 340 L300 172 M300 172 L360 172 M300 240 L344 240 M300 340 L372 340"
          stroke="url(#accent)" stroke-width="18" fill="none"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <circle cx="256" cy="418" r="5" fill="#ff2d55" opacity="0.9"/>
  <circle cx="238" cy="418" r="3" fill="#ff2d55" opacity="0.5"/>
  <circle cx="274" cy="418" r="3" fill="#ff2d55" opacity="0.5"/>
</svg>
